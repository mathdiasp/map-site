<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MAP · Central de Propostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Questrial&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1C2E4A;--brass:#9A6F30;--brassL:#D8B784;--ink:#2b2b2b;--line:#e6e6e6;--ui:#f0f2f5;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,system-ui,sans-serif;color:#1f2430;background:var(--ui);}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;padding:10px 20px;gap:14px;flex-wrap:wrap;}
.maplogo{flex:none;display:block;}
.brand{font-family:'Poiret One',sans-serif;font-size:19px;letter-spacing:3px;text-transform:uppercase;}
.brand small{font-family:Inter;font-size:9.5px;letter-spacing:2px;color:var(--brassL);display:block;margin-top:2px;}
.tabs{display:flex;gap:6px;}
.tab{font-size:13px;font-weight:600;color:#c9d2df;background:transparent;border:none;padding:8px 14px;border-radius:7px;cursor:pointer;}
.tab.on{background:rgba(255,255,255,.14);color:#fff;}
.tb-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{font:inherit;font-size:12.5px;font-weight:600;border:none;border-radius:7px;padding:8px 13px;cursor:pointer;transition:.15s;}
.btn.primary{background:var(--brass);color:#fff;}
.btn.primary:hover{background:#7f5b26;}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;}
.btn.ghost:hover{background:rgba(255,255,255,.22);}
.btn.soft{background:#fff;border:1px solid var(--line);color:#33405c;}
.btn.soft:hover{border-color:var(--navy);}
.btn[disabled]{opacity:.5;cursor:wait;}
.view{display:none;}
.view.on{display:block;}
/* ============ GERADOR ============ */
.wrap{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 59px);}
.form-pane{overflow-y:auto;padding:18px 18px 70px;border-right:1px solid var(--line);background:#fff;}
.preview-pane{overflow-y:auto;padding:28px;background:#e7eaef;display:flex;justify-content:center;align-items:flex-start;}
.sec{margin-bottom:20px;}
.sec h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
label{display:block;font-size:12px;color:#5a6270;margin:9px 0 4px;font-weight:500;}
input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;font:inherit;font-size:13px;border:1px solid #d7dbe2;border-radius:7px;padding:8px 11px;color:#1f2430;background:#fff;}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.aibox{border:1.5px dashed #c4a26a;background:#fdfaf4;border-radius:10px;padding:12px;margin-bottom:18px;}
.aibox h4{font-size:12.5px;color:var(--brass);margin-bottom:6px;}
.aibox textarea{min-height:84px;background:#fff;}
.aibox .thumb{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#5a6270;}
.aibox .thumb img{height:44px;border-radius:6px;border:1px solid var(--line);}
.aibox .arow{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap;}
.svc{border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;}
.svc-head{display:flex;align-items:center;justify-content:space-between;}
.svc-head .nm{font-weight:600;font-size:13.5px;}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;}
.chk input{width:15px;height:15px;accent-color:var(--brass);}
.levels{margin-top:9px;display:none;}
.levels.on{display:block;}
.lvl{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border:1px solid #e4e7ec;border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12.5px;}
.lvl.sel{border-color:var(--brass);background:#fbf7f0;}
.lvl .pr{font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:3px;}.prin{width:64px;font:inherit;font-weight:700;color:var(--navy);border:1px solid transparent;background:transparent;border-radius:5px;padding:2px 4px;text-align:right;}.prin:hover{border-color:#d7dbe2;background:#fff;}.prin:focus{outline:none;border-color:var(--brass);background:#fff;}
.hint{font-size:11px;color:#94a0af;margin-top:5px;line-height:1.5;}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;}
/* ============ CRM ============ */
.crm{padding:20px;height:calc(100vh - 59px);overflow:auto;}
.crm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.crm-top input{max-width:280px;}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;}
.kcol{background:#e9ecf1;border-radius:10px;padding:10px;min-height:200px;}
.kcol h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#5a6270;display:flex;justify-content:space-between;margin:2px 4px 10px;}
.kcol h4 .sum{color:var(--navy);}
.kcard{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:9px;cursor:grab;box-shadow:0 1px 2px rgba(20,30,50,.06);}
.kcard .cli{font-weight:700;font-size:13.5px;}
.kcard .sub{font-size:11px;color:#8a94a3;margin-top:2px;}
.lead-card{cursor:pointer;transition:box-shadow .15s;}.lead-card:hover{box-shadow:0 3px 12px rgba(154,111,48,.22);}.lcontato{font-size:11px;color:#6c7686;margin-top:5px;word-break:break-all;}.lead-ficha .lrow{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #f0f1f4;font-size:13px;}.lead-ficha .lrow.col{flex-direction:column;gap:5px;}.lead-ficha .lk{min-width:120px;color:#8a94a3;font-size:12px;}.lead-ficha .lv{color:#1f2430;font-weight:500;word-break:break-word;}.lead-ficha .lmsg{background:#f7f8fa;border:1px solid #eceef2;border-radius:8px;padding:10px 12px;line-height:1.6;color:#33405c;white-space:pre-wrap;}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}.tg{font-size:9.5px;padding:2px 7px;border-radius:20px;background:#eef0f4;color:#5a6270;font-weight:600;}.tg-new{background:#fbf1e2;color:#9A6F30;}.kcard .tot{font-weight:700;color:var(--navy);font-size:12.5px;margin-top:6px;}
.kcard .ka{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.mini{font-size:11px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;}
.mini.load{border-color:var(--navy);color:var(--navy);}
.mini.del{border-color:#e3b7b7;color:#b44;}
.kcol.dragover{outline:2px dashed var(--brass);}
/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.on{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.modal .mh b{font-size:14.5px;}
.modal .mb{padding:16px 18px;overflow-y:auto;}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.modal textarea{min-height:200px;font-size:13px;line-height:1.6;}
.modal pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.65;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:14px;}
.x{background:none;border:none;font-size:19px;cursor:pointer;color:#8a94a3;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:80;}
.toast.show{opacity:1;}
/* ===== DOC PREVIEW (padrão MAP) ===== */
.doc{width:794px;background:#fff;box-shadow:0 8px 40px -14px rgba(20,34,56,.35);color:var(--ink);font-family:'Questrial',sans-serif;font-size:13.5px;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.doc .pg{padding:52px 56px;}
.d-top{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid #e7e7e7;}
.d-top .l{font-family:'Poiret One',sans-serif;font-size:19px;letter-spacing:4px;text-transform:uppercase;color:var(--navy);}
.d-top .r{font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:#9a9a9a;}
.d-title{margin:44px 0 0;}
.d-title .t1{font-family:'Poiret One',sans-serif;font-size:74px;line-height:.9;color:var(--navy);}
.d-title .t2{font-family:'Poiret One',sans-serif;font-size:74px;line-height:1;color:var(--navy);margin-left:150px;}
.d-gold{width:80px;height:3px;background:var(--brass);margin:26px 0 0;}
.d-meta{margin-top:20px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8f8f8f;}
.d-intro{margin-top:22px;font-size:15px;line-height:1.8;color:#3a3a3a;max-width:62ch;white-space:pre-wrap;}
.d-mosaic{display:flex;gap:12px;margin-top:30px;height:400px;}
.d-mosaic .big{flex:1.35;border-radius:6px;overflow:hidden;}
.d-mosaic .col{flex:1;display:flex;flex-direction:column;gap:12px;}
.d-mosaic .sm{flex:1;border-radius:6px;overflow:hidden;}
.d-mosaic img{width:100%;height:100%;object-fit:cover;display:block;}
.d-cap{margin-top:12px;font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--brass);}
.svc-block{margin-top:34px;page-break-inside:avoid;}
.svc-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #e5e5e5;padding-bottom:11px;margin-bottom:15px;}
.svc-n{font-family:'Poiret One',sans-serif;font-size:31px;color:var(--navy);}
.svc-s{font-size:11px;letter-spacing:1px;color:#a0a0a0;}
.d-items{list-style:none;columns:2;column-gap:34px;}
.d-items li{position:relative;padding-left:20px;font-size:13px;line-height:1.85;color:#2c2c2c;-webkit-column-break-inside:avoid;break-inside:avoid;}
.d-items li:before{content:'';position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--brass);}
.sub-lvl{margin-top:18px;}.sub-n{font-family:'Poiret One',sans-serif;font-size:21px;color:var(--navy);margin-bottom:10px;}.sub-n:before{content:'';display:inline-block;width:20px;height:2px;background:var(--brass);vertical-align:middle;margin-right:11px;}
.svc-price{margin-top:13px;font-size:12px;color:#8f8f8f;}
.svc-price .pb{font-family:'Poiret One',sans-serif;font-size:24px;color:var(--navy);}
.d-total{margin-top:38px;padding:22px 24px;background:var(--navy);border-radius:6px;page-break-inside:avoid;}
.d-total .tl{font-family:'Poiret One',sans-serif;font-size:22px;color:#F4F1EA;margin-bottom:12px;}
.d-total .rw{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px;color:#C4CBD6;}
.d-total .rw .pb{font-family:'Poiret One',sans-serif;font-size:20px;color:#F4F1EA;}
.d-total .grand{border-top:1px solid rgba(216,183,132,.4);margin-top:10px;padding-top:12px;color:var(--brassL);}
.d-total .grand .pb{font-size:26px;color:var(--brassL);}
.d-cols{display:flex;gap:56px;margin-top:32px;page-break-inside:avoid;}
.d-cols .c{flex:1;}
.d-cols .ct{font-family:'Poiret One',sans-serif;font-size:17px;color:var(--navy);margin-bottom:10px;}
.d-cols p{margin:0 0 8px;font-size:13px;line-height:1.7;color:#3a3a3a;white-space:pre-wrap;}
.d-foot{margin-top:42px;padding-top:15px;border-top:1px solid #e7e7e7;display:flex;justify-content:space-between;align-items:flex-end;}
.d-foot .fn{font-family:'Poiret One',sans-serif;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:var(--navy);}
.d-foot .fm{font-size:10px;color:#9a9a9a;line-height:1.6;text-align:right;}
@media print{
  @page{size:A4;margin:13mm;}
  body{background:#fff;}
  .topbar,.form-pane,.toast,.overlay,.crm{display:none !important;}
  .view{display:none !important;}
  #view-gerador{display:block !important;}
  .wrap{display:block;height:auto;}
  .preview-pane{display:block;padding:0;background:#fff;overflow:visible;}
  .doc{width:auto;box-shadow:none;}
  .of{font-size:11.5pt;}
  .of-tab{page-break-inside:avoid;}
  .of-ass{page-break-inside:avoid;}
  .doc .pg{padding:0;}
  .d-mosaic{height:340px;}
}
@media(max-width:1100px){.wrap{grid-template-columns:1fr;height:auto;}.preview-pane{padding:14px;}.doc{width:100%;}.kanban{grid-template-columns:1fr 1fr;}}
.of{font-family:Georgia,"Times New Roman",serif;color:#111;font-size:12.5pt;line-height:1.6;padding:0;}.of-head{text-align:center;border-bottom:2px solid #1C2E4A;padding-bottom:10px;margin-bottom:26px;}.of-marca{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Poiret One',sans-serif;font-size:26px;letter-spacing:6px;color:#1C2E4A;}.of-sub{font-family:Inter,sans-serif;font-size:9pt;letter-spacing:2px;text-transform:uppercase;color:#666;margin-top:4px;}.of-num{font-weight:bold;margin-bottom:18px;}.of-data{text-align:right;margin-bottom:26px;}.of-dest{margin-bottom:20px;line-height:1.5;}.of-assunto{margin-bottom:22px;}.of-corpo p{margin:0 0 13px;text-align:justify;}.of-tab{width:100%;border-collapse:collapse;margin:16px 0 14px;font-size:11pt;}.of-tab th,.of-tab td{border:1px solid #999;padding:7px 9px;text-align:left;}.of-tab th{background:#eef0f4;font-size:10pt;}.of-tab td.c{text-align:center;}.of-tab td.r,.of-tab th.r{text-align:right;}.of-tab tr.tot td{font-weight:bold;background:#f6f7f9;}.of-nota{font-size:10.5pt;font-style:italic;}.of-anexo{margin-top:40px;padding-top:22px;border-top:1px solid #bbb;page-break-inside:auto;}.of-anexo-t{font-weight:bold;font-size:11.5pt;letter-spacing:.5px;margin-bottom:16px;text-align:center;}.of-menu{margin-bottom:18px;page-break-inside:avoid;}.of-menu-t{font-weight:bold;font-size:11.5pt;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:8px;}.of-menu-l{margin:0;padding-left:20px;columns:2;column-gap:26px;}.of-menu-l li{font-size:10.5pt;line-height:1.55;break-inside:avoid;-webkit-column-break-inside:avoid;}.of-ass{margin-top:46px;text-align:center;}.of-linha{width:260px;border-top:1px solid #333;margin:0 auto 6px;}.of-nome{font-weight:bold;}.of-cargo{font-size:10.5pt;}.of-cnpj{font-size:9.5pt;color:#555;margin-top:3px;}body.locked .topbar,body.locked .view,body.locked .toast{display:none !important;}.gate{position:fixed;inset:0;z-index:999;background:#1C2E4A;display:none;align-items:center;justify-content:center;padding:20px;}body.locked .gate{display:flex;}.gate-box{width:100%;max-width:360px;text-align:center;color:#F4F1EA;}.gate-logo{margin-bottom:18px;}.gate-mark{font-family:'Poiret One',sans-serif;font-size:34px;letter-spacing:8px;color:#fff;}.gate-sub{font-size:9.5px;letter-spacing:3px;text-transform:uppercase;color:#D8B784;margin-top:4px;}.gate-form{margin-top:26px;text-align:left;}.gate-form label{color:#aab6c8;font-size:11.5px;letter-spacing:.5px;}.gate-form input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;}.gate-form input:focus{border-color:#D8B784;}.gate-btn{width:100%;margin-top:16px;background:#9A6F30;color:#fff;border:none;border-radius:7px;padding:11px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;}.gate-btn:hover{background:#7f5b26;}.gate-btn[disabled]{opacity:.6;cursor:wait;}.gate-err{margin-top:12px;font-size:12.5px;color:#ffb4a8;min-height:16px;}@media print{.gate{display:none !important;}}</style></head>
<body class="locked">
<div class="gate" id="gate"><div class="gate-box"><div class="gate-logo"><svg width="56" height="56" viewBox="-40 -40 80 80" xmlns="http://www.w3.org/2000/svg"><circle r="34" fill="none" stroke="#F4F1EA" stroke-width="2.6"/><circle r="27" fill="none" stroke="#F4F1EA" stroke-width="0.8" opacity=".3"/><g transform="rotate(40)"><path d="M0 -25 L5.2 3 L0 7.4 L-5.2 3 Z" fill="#9A6F30"/><path d="M0 7.4 L3.4 24 L-3.4 24 Z" fill="#8fa0b8"/></g><g transform="rotate(-28)"><ellipse rx="5.4" ry="7.4" fill="#F4F1EA"/><path d="M0 -6.6 Q1.8 0 0 6.6" stroke="#1C2E4A" stroke-width="1.2" fill="none"/></g></svg></div><div class="gate-mark">MAP</div><div class="gate-sub">Central de Propostas</div><div class="gate-form"><label>E-mail</label><input type="email" id="gMail" autocomplete="username"><label style="margin-top:10px">Senha</label><input type="password" id="gPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateLogin()"><button class="gate-btn" id="gBtn" onclick="gateLogin()">Entrar</button><div class="gate-err" id="gErr"></div></div></div></div>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:22px;">
    <div class="brand" style="display:flex;align-items:center;gap:10px"><svg class="maplogo" width="30" height="30" viewBox="-40 -40 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle r="34" fill="none" stroke="#F4F1EA" stroke-width="2.6"/><circle r="27" fill="none" stroke="#F4F1EA" stroke-width="0.8" opacity=".3"/><g transform="rotate(40)"><path d="M0 -25 L5.2 3 L0 7.4 L-5.2 3 Z" fill="#9A6F30"/><path d="M0 7.4 L3.4 24 L-3.4 24 Z" fill="#8fa0b8"/></g><g transform="rotate(-28)"><ellipse rx="5.4" ry="7.4" fill="#F4F1EA"/><path d="M0 -6.6 Q1.8 0 0 6.6" stroke="#1C2E4A" stroke-width="1.2" fill="none"/></g></svg><span>MAP<small>Central de Propostas</small></span></div>
    <div class="tabs">
      <button class="tab on" id="tab-gerador" onclick="go('gerador')">Gerador</button>
      <button class="tab" id="tab-crm" onclick="go('crm')">CRM</button>
    </div>
  </div>
  <div class="tb-actions">
    <button class="btn ghost" onclick="novo()">Nova</button>
    <button class="btn ghost" onclick="dup()">Duplicar</button>
    <button class="btn ghost" onclick="genMsg()">Mensagem cliente</button>
    <button class="btn ghost" onclick="genBrief()">Briefing fornecedor</button>
    <button class="btn ghost" onclick="openSup()">Fornecedores IA</button>
    <button class="btn ghost" onclick="salvar()">Salvar</button>
    <button class="btn primary" onclick="exportPDF()">Exportar PDF</button>
    <button class="btn ghost" title="Configurações" onclick="openConfig()">&#9881;</button><button class="btn ghost" title="Sair" onclick="sbLogout()">Sair</button>
  </div>
</div>

<div class="view on" id="view-gerador">
  <div class="wrap">
    <div class="form-pane">
      <div class="aibox">
        <h4>&#10024; Analisar pedido do cliente</h4>
        <textarea id="aiInput" placeholder="Cole aqui a mensagem do cliente (ou cole um print com Ctrl+V)"></textarea>
        <div class="thumb" id="aiThumb" style="display:none"><img id="aiImg"/><button class="mini del" onclick="clearImg()">remover print</button></div>
        <div class="arow">
          <button class="btn primary" id="aiBtn" onclick="analisar()">Analisar e preencher</button>
          <input type="file" id="aiFile" accept="image/*" style="display:none" onchange="pickImg(this)">
          <button class="btn soft" onclick="document.getElementById('aiFile').click()">Anexar print</button>
        </div>
        <div class="hint">A IA lê o pedido, preenche a proposta e sugere os níveis do catálogo. Confira antes de enviar.</div>
      </div>
      <div id="form"></div>
    </div>
    <div class="preview-pane"><div class="doc" id="preview"></div></div>
  </div>
</div>

<div class="view" id="view-crm">
  <div class="crm">
    <div class="crm-top">
      <input type="text" id="crmSearch" placeholder="Buscar cliente ou empresa..." oninput="renderKanban()">
      <div style="display:flex;gap:8px;">
        <button class="btn primary" onclick="sincronizar()">Sincronizar</button><button class="btn soft" onclick="backup()">Backup</button>
        <button class="btn soft" onclick="document.getElementById('impFile').click()">Importar</button>
        <input type="file" id="impFile" accept=".json" style="display:none" onchange="restore(this)">

function money(n){return "R$ "+Math.round(n).toLocaleString("pt-BR");}
function el(id){return document.getElementById(id);}
function stripGreeting(t,nome){if(!t)return t;var orig=t.trim();var x=orig;
var first=nome?nome.trim().split(" ")[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"):"";
for(var i=0;i<3;i++){
x=x.replace(/^\s*(ol[áa]|oi|e a[íi]|bom dia|boa tarde|boa noite|prezad[oa]s?|car[oa]s?)(?=$|[\s,!?:.])[\s,!?:.]*/i,"");
if(first)x=x.replace(new RegExp("^\\s*"+first+"[\\s,!?:.-]+","i"),"");
x=x.replace(/^\s*(tudo bem\??|tudo bom\??)[\s,!.?-]*/i,"");
x=x.replace(/^[\s,!?.-]+/,"");}
if(!x.trim())return orig;
return x.charAt(0).toUpperCase()+x.slice(1);}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m){const t=el("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}

function dayBlocksHTML(){syncDays();return S.days.map((d,i)=>{const inner=Object.keys(CATALOG).map(k=>{const c=CATALOG[k];const sv=d.svc[k];const lv=c.levels.map(l=>`<div class="lvl ${sv.lvl===l.id?'sel':''}" onclick="setDayLvl(${i},'${k}','${l.id}')"><span>${l.name}</span><span class="pr">R$ <input class="prin" type="number" min="0" value="${l.price}" onclick="event.stopPropagation()" onchange="savePreco('${k}','${l.id}',this.value)"></span></div>`).join("");return `<div class="svc"><div class="svc-head"><span class="nm">${c.label}</span><label class="chk"><input type="checkbox" ${sv.on?'checked':''} onchange="setDayOn(${i},'${k}',this.checked)"> incluir</label></div><div class="levels ${sv.on?'on':''}">${lv}</div></div>`;}).join("");return `<div style="border:1px solid #d7dbe2;border-radius:10px;padding:11px;margin-bottom:12px;background:#fbfcfd"><div style="font-weight:700;font-size:13px;color:#1C2E4A;margin-bottom:8px">Dia ${i+1} <span style="font-weight:400;color:#8a94a3">\u00b7 ${money(dayPP(i))} por pessoa</span></div>${inner}</div>`;}).join("")+`<div class="hint">No modo por dia, cada servi\u00e7o tem um n\u00edvel por dia. Para oferecer alternativas ao cliente, desligue o modo por dia.</div>`;}
function setPerDay(v){S.perDay=v;if(v)syncDays();buildForm();render();}
function setDayOn(i,k,v){syncDays();S.days[i].svc[k].on=v;buildForm();render();}
function setDayLvl(i,k,id){syncDays();S.days[i].svc[k].lvl=id;S.days[i].svc[k].on=true;buildForm();render();}
function buildForm(){
  const svcHTML=Object.keys(CATALOG).map(k=>{
    const c=CATALOG[k],s=S.svc[k];
    const lv=c.levels.map(l=>`<div class="lvl ${(s.lvls||[]).includes(l.id)?'sel':''}" onclick="toggleLvl('${k}','${l.id}')"><span>${(s.lvls||[]).includes(l.id)?'\u2713 ':''}${l.name}</span><span class="pr">R$ <input class="prin" type="number" min="0" value="${l.price}" onclick="event.stopPropagation()" onchange="savePreco('${k}','${l.id}',this.value)"></span></div>`).join("");
    return `<div class="svc"><div class="svc-head"><span class="nm">${c.label}</span><label class="chk"><input type="checkbox" ${s.on?'checked':''} onchange="setOn('${k}',this.checked)"> incluir</label></div><div class="levels ${s.on?'on':''}" id="lv-${k}">${lv}<div class="hint">Marque mais de um n\u00edvel para oferecer op\u00e7\u00f5es ao cliente. Os pre\u00e7os s\u00e3o edit\u00e1veis e ficam salvos. <a href="#" onclick="event.preventDefault();resetPrecos()" style="color:#9A6F30">restaurar padr\u00e3o</a></div></div></div>`;
  }).join("");

function upd(k,v){if(k==="dias"){S.dias=Math.max(1,v||1);syncDays();buildForm();render();return;}
  if(k==="local"){const prev=S.local;if(S.obs===obsFor(prev)||!S.obs.trim()){S.obs=obsFor(v);const t=document.querySelectorAll(".form-pane textarea");if(t.length)t[t.length-2]&&(t[t.length-2].value=S.obs);}}S[k]=v;if(k==="local"){buildForm();}render();}

function savePreco(k,id,v){const n=Math.max(0,parseInt(v)||0);const lv=CATALOG[k].levels.find(x=>x.id===id);if(!lv)return;lv.price=n;let o={};try{o=JSON.parse(localStorage.getItem("map_precos")||"{}");}catch(e){}o[k]=o[k]||{};o[k][id]=n;localStorage.setItem("map_precos",JSON.stringify(o));buildForm();render();}
function resetPrecos(){if(!confirm("Voltar todos os pre\u00e7os ao padr\u00e3o do cat\u00e1logo?"))return;localStorage.removeItem("map_precos");location.reload();}
function blankDaySvc(){const o={};Object.keys(CATALOG).forEach(k=>{o[k]={on:false,lvl:CATALOG[k].levels[0].id};});return o;}
function syncDays(){const n=Math.max(1,S.dias||1);S.days=S.days||[];while(S.days.length<n)S.days.push({svc:blankDaySvc()});if(S.days.length>n)S.days=S.days.slice(0,n);S.days.forEach(d=>{if(!d.svc)d.svc=blankDaySvc();Object.keys(CATALOG).forEach(k=>{if(!d.svc[k])d.svc[k]={on:false,lvl:CATALOG[k].levels[0].id};});});return S.days;}
function daySel(i){const d=(S.days||[])[i];if(!d)return [];return Object.keys(CATALOG).filter(k=>d.svc[k]&&d.svc[k].on).map(k=>{const c=CATALOG[k];const l=c.levels.find(x=>x.id===d.svc[k].lvl)||c.levels[0];return {key:k,label:c.label,service:c.service,level:l};});}
function dayPP(i){return daySel(i).reduce((a,x)=>a+x.level.price,0);}
function perDayTotal(){const pax=S.pessoas||0;let t=0;for(let i=0;i<(S.days||[]).length;i++)t+=dayPP(i)*pax;return t;}
function anyDayService(){return (S.days||[]).some((d,i)=>daySel(i).length>0);}
function selected(){const out=[];Object.keys(CATALOG).filter(k=>S.svc[k].on).forEach(k=>{const c=CATALOG[k];const ids=(S.svc[k].lvls&&S.svc[k].lvls.length)?S.svc[k].lvls:[c.levels[0].id];const lv=c.levels.filter(l=>ids.indexOf(l.id)>=0);lv.forEach(l=>out.push({key:k,label:c.label,service:c.service,level:l,alt:lv.length>1}));});return out;}
function groups(){const g={};selected().forEach(s=>{(g[s.key]=g[s.key]||[]).push(s);});return g;}
function scenarios(){const g=groups(),keys=Object.keys(g);if(!keys.length)return [];let combos=[[]];keys.forEach(k=>{const nx=[];combos.forEach(c=>g[k].forEach(o=>nx.push(c.concat([o]))));combos=nx;});return combos.map(c=>({parts:c,pp:c.reduce((a,x)=>a+x.level.price,0)}));}

function getKey(){return localStorage.getItem("map_apikey")||"";}
async function callClaude(content,useSearch,maxTokens){
  const key=getKey();
  if(!key){openConfig();throw new Error("Configure sua chave de API primeiro.");}
  const body={model:"claude-sonnet-4-6",max_tokens:maxTokens||2000,messages:[{role:"user",content:content}]};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text();throw new Error("Erro da API ("+r.status+"). "+t.slice(0,180));}
  const d=await r.json();
  return d.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

  for(const it of items){ if(it.type.indexOf("image")===0){ const f=it.getAsFile(); const rd=new FileReader(); rd.onload=()=>setImg(rd.result); rd.readAsDataURL(f); } }
});
function pickImg(inp){const f=inp.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>setImg(rd.result); rd.readAsDataURL(f);}

async function analisar(){
  const txt=el("aiInput").value.trim();
  if(!txt&&!IMG){toast("Cole o pedido ou um print primeiro");return;}
  const btn=el("aiBtn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Analisando...';
  try{
    const prompt=`Você é o assistente comercial da MAP, consultoria de alimentação para eventos corporativos em São Paulo, do Matheus Prado.
Analise o pedido do cliente abaixo (texto e/ou imagem de conversa) e devolva SOMENTE um JSON válido, sem markdown, sem comentários, neste formato:
{"cliente":"nome do contato ou vazio","empresa":"ou vazio","contato":"telefone/whats ou vazio","data":"data do evento por extenso em pt-BR ou vazio","email":"ou vazio","segmento":"segmento da empresa ou vazio","tipo_demanda":"Evento pontual|Demanda recorrente|Licitação","pessoas":numero ou 0,"dias":numero de dias do evento (1 se nao mencionado),"local":"cidade/região ou vazio","formato":"Corporativo/Confraternização/etc","servicos":[{"tipo":"coffee|brunch|coquetel","nivel":"id do nível"}],"extra":"serviços fora do catálogo, ex: barraquinha de cachorro-quente, ou vazio","intro":"abertura curta da proposta. REGRAS: no maximo 3 frases e 45 palavras; NAO cumprimente nem cite o nome do cliente; NAO repita data, cidade nem numero de pessoas (ja aparecem no cabecalho); NAO descreva o documento (nada de 'incluo abaixo as opcoes, valores e condicoes'); NAO explique por que escolheu um nivel nem diga que faltou informacao; escreva em primeira pessoa do singular (montei, pensei, caprichei), nunca nos/nossa equipe/ficamos felizes; diga o que voce montou e uma nota de personalizacao ligada ao pedido ou ao publico, e termine dizendo que e um ponto de partida ajustavel; SEM travessao. Exemplo do tom: Montei o coffee break dos dois dias com um cardapio variado, pensando em quem fica o dia inteiro em treinamento. Nada aqui e engessado: ajustamos itens e quantidades ate ficar com a cara do seu evento.","observacoes":"pontos a confirmar com o cliente, ou vazio"}
Níveis válidos: coffee: ess (Essencial R$150), comp (Completo R$180), prem (Premium R$220). brunch: cla (Clássico R$240), prem (Premium R$280). coquetel: cla (Clássico R$215), prem (Premium R$270).
Escolha o nível pelo tom do pedido (básico/meio termo -> mais baixo; sofisticado/diretoria -> mais alto). Se o cliente pedir algo que não é coffee/brunch/coquetel, NÃO invente: coloque em "extra".
Pedido do cliente:
${txt||"(somente imagem)"}`;
    let content;
    if(IMG){const m=IMG.match(/^data:(image\/\w+);base64,(.*)$/); content=[{type:"image",source:{type:"base64",media_type:m[1],data:m[2]}},{type:"text",text:prompt}];}
    else content=[{type:"text",text:prompt}];
    const out=await callClaude(content,false,1500);
    const clean=out.replace(/```json|```/g,"").trim();
    const j=JSON.parse(clean.slice(clean.indexOf("{"),clean.lastIndexOf("}")+1));
    if(j.cliente)S.cliente=j.cliente; if(j.empresa)S.empresa=j.empresa; if(j.contato)S.contato=j.contato; if(j.email)S.email=j.email; if(j.segmento)S.segmento=j.segmento; if(j.tipo_demanda)S.tipoDemanda=j.tipo_demanda;
    if(j.data)S.data=j.data; if(j.pessoas)S.pessoas=j.pessoas; if(j.dias)S.dias=j.dias; if(j.local){const pv=S.local; if(S.obs===obsFor(pv))S.obs=obsFor(j.local); S.local=j.local;} if(j.formato)S.formato=j.formato;
    if(j.intro)S.intro=stripGreeting(j.intro,j.cliente||S.cliente); if(j.extra)S.extra=j.extra;
    Object.keys(S.svc).forEach(k=>S.svc[k].on=false);
    (j.servicos||[]).forEach(sv=>{ if(S.svc[sv.tipo]){S.svc[sv.tipo].on=true; let ns=sv.niveis||(sv.nivel?[sv.nivel]:[]); ns=ns.filter(n=>CATALOG[sv.tipo].levels.some(l=>l.id===n)); if(ns.length)S.svc[sv.tipo].lvls=ns;}});
    if(j.observacoes)S.notas=(S.notas?S.notas+"\n":"")+"A confirmar: "+j.observacoes;
    buildForm(); render(); toast("Proposta preenchida. Confira os campos.");
  }catch(e){alert("Não consegui analisar: "+e.message);}
  btn.disabled=false; btn.textContent="Analisar e preencher";
}

async function cloudPush(rec){
  if(!cloudOn())return false;
  try{
    var r=await fetch(sbUrl()+"/rest/v1/map_propostas?on_conflict=id",{method:"POST",
      headers:Object.assign(sbHeaders(true),{"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify([recRow(rec)])});
    return r.ok;
  }catch(e){return false;}
}
async function cloudDelete(id){
  if(!cloudOn())return false;
  try{var r=await fetch(sbUrl()+"/rest/v1/map_propostas?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:sbHeaders(true)});return r.ok;}catch(e){return false;}
}
async function cloudPull(){
  if(!cloudOn())return null;
  var r=await fetch(sbUrl()+"/rest/v1/map_propostas?select=payload,atualizado&order=atualizado.desc",{headers:sbHeaders(true)});
  if(!r.ok)throw new Error("Falha ao ler propostas ("+r.status+")");
  var d=await r.json();
  return d.map(function(x){return x.payload;}).filter(Boolean);
}
async function cloudLeads(){
  if(!cloudOn())return [];
  var r=await fetch(sbUrl()+"/rest/v1/map_leads?convertido=eq.false&select=*&order=criado_em.desc",{headers:sbHeaders(true)});
  if(!r.ok)return [];
  return await r.json();
}

    headers:sbHeaders(true),body:JSON.stringify({convertido:true})});}catch(e){}

var LEADS=[];
async function sincronizar(silencioso){
  if(!cloudOn()){if(!silencioso)toast("Configure e entre na nuvem primeiro");return;}
  try{
    var remotos=await cloudPull();
    if(remotos){
      var locais=all(), mapa={};
      locais.forEach(function(r){mapa[r.id]=r;});
      remotos.forEach(function(r){ if(!r||!r.id)return;
        var l=mapa[r.id];
        if(!l||(r.updated||0)>=(l.updated||0))mapa[r.id]=r;});
      persist(Object.keys(mapa).map(function(k){return mapa[k];}));
      // sobe o que só existe local
      var idsRemotos={}; remotos.forEach(function(r){if(r&&r.id)idsRemotos[r.id]=1;});
      for(const r of locais){ if(!idsRemotos[r.id]) await cloudPush(r); }
    }
    LEADS=await cloudLeads();
    renderKanban();
    if(!silencioso)toast("Sincronizado: "+all().length+" propostas, "+LEADS.length+" leads novos");
  }catch(e){ if(!silencioso)alert("Erro ao sincronizar: "+e.message); }
}

    toast("Bem-vindo de volta");
  }catch(err){
    e.textContent = /invalid/i.test(err.message)?"E-mail ou senha incorretos.":err.message;
    b.disabled=false; b.textContent="Entrar";
  }
}
async function checarSessao(){
  if(!sbTok()){lock();return false;}
  try{
    var r=await fetch(sbUrl()+"/rest/v1/map_propostas?select=id&limit=1",{headers:sbHeaders(true)});
    if(r.status===401||r.status===403){localStorage.removeItem("map_sb_token");lock();return false;}
    unlock(); return true;
  }catch(e){ unlock(); return true; }   // sem internet: libera o uso local
}

/* ---------- CRM ---------- */
function all(){try{return JSON.parse(localStorage.getItem("map_propostas")||"[]");}catch(e){return [];}}
function persist(a){localStorage.setItem("map_propostas",JSON.stringify(a));}
function salvar(){
  if(!S.cliente){toast("Preencha o nome do cliente");return;}
  const a=all(); const rec=JSON.parse(JSON.stringify(S)); rec.total=S.perDay?perDayTotal():perPerson()*(S.pessoas||0)*(S.dias||1); rec.updated=Date.now();
  if(S.id){const i=a.findIndex(x=>x.id===S.id); if(i>=0)a[i]=rec; else a.push(rec);}
  else {rec.id="p"+Date.now(); S.id=rec.id; a.push(rec);}
  persist(a); cloudPush(rec); if(S._leadId){leadConvertido(S._leadId,rec.id);LEADS=LEADS.filter(function(l){return l.id!==S._leadId;});S._leadId=null;} toast(cloudOn()?"Salva no CRM e na nuvem":"Proposta salva no CRM");
}
function novo(){S=blank();IMG=null;el("aiInput").value="";clearImg();buildForm();render();toast("Nova proposta");}
function dup(){if(!S.cliente){toast("Nada para duplicar");return;}S=JSON.parse(JSON.stringify(S));S.id=null;S.ref=blank().ref;S.status="Lead";buildForm();render();toast("Duplicada. Salve para criar novo registro.");}
function loadRec(id){const r=all().find(x=>x.id===id); if(!r)return; S=JSON.parse(JSON.stringify(r)); if(!S.svc)S.svc=blank().svc; if(!S.dias)S.dias=1; if(!S.tipoDemanda)S.tipoDemanda="Evento pontual"; if(S.email===undefined)S.email=""; if(S.perDay)syncDays(); Object.keys(S.svc).forEach(k=>{if(!S.svc[k].lvls)S.svc[k].lvls=[S.svc[k].lvl||CATALOG[k].levels[0].id];}); buildForm(); render(); go('gerador'); toast("Carregada no gerador");}
function delRec(id){if(!confirm("Excluir esta proposta?"))return; persist(all().filter(x=>x.id!==id)); cloudDelete(id); renderKanban();}
function setStage(id,v){const a=all();const r=a.find(x=>x.id===id);if(r){r.status=v;r.updated=Date.now();persist(a);cloudPush(r);renderKanban();if(S.id===id)S.status=v;}}
function renderKanban(){
  const q=(el("crmSearch").value||"").toLowerCase();
  const a=all().filter(r=>!q||((r.cliente||"")+" "+(r.empresa||"")).toLowerCase().includes(q));
  el("kanban").innerHTML=STAGES.map(st=>{
    const cards=a.filter(r=>r.status===st).sort((x,y)=>y.updated-x.updated);
    const sum=cards.reduce((t,r)=>t+(r.total||0),0);
    const leadsHTML=(st==="Lead"&&LEADS.length)?LEADS.map(l=>`<div class="kcard lead-card" style="border-left:3px solid #9A6F30;background:#fdfaf4" onclick="leadModal('${l.id}')" title="Ver ficha do lead"><div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#9A6F30;font-weight:700">novo do site</div><div class="cli">${esc(l.nome||"Sem nome")}</div><div class="sub">${esc(l.empresa||"")} ${l.data_evento?"\u00b7 "+esc(l.data_evento):""} ${l.pessoas?"\u00b7 "+l.pessoas+" pax":""}</div>${(l.email||l.telefone||l.contato)?`<div class="lcontato">${l.telefone||l.contato?esc(l.telefone||l.contato):""}${(l.telefone||l.contato)&&l.email?" \u00b7 ":""}${l.email?esc(l.email):""}</div>`:""}${(l.utm_source||l.cidade)?`<div class="tags">${l.cidade?`<span class="tg">${esc(l.cidade)}</span>`:""}${l.utm_source?`<span class="tg tg-new">${esc(l.utm_source)}</span>`:""}</div>`:""}${l.mensagem?`<div class="sub" style="margin-top:4px">${esc(l.mensagem).slice(0,90)}</div>`:""}<div class="ka" onclick="event.stopPropagation()"><button class="mini load" onclick="leadParaProposta('${l.id}')">Criar proposta</button>${l.contato?`<button class="mini" onclick="window.open('https://wa.me/55'+'${(l.contato||"").replace(/\D/g,"")}'.replace(/^55/,''),'_blank')">WhatsApp</button>`:""}<button class="mini del" onclick="leadDescartar('${l.id}')">Descartar</button></div></div>`).join(""):"";
    const html=leadsHTML+cards.map(r=>`<div class="kcard" draggable="true" ondragstart="drag(event,'${r.id}')">
      <div class="cli">${esc(r.cliente)||"Sem nome"}</div>
      <div class="sub">${esc(r.empresa||"")} ${r.data?"\u00b7 "+esc(r.data):""} ${r.pessoas?"\u00b7 "+r.pessoas+" pax":""}${(r.dias||1)>1?" \u00b7 "+r.dias+" dias":""}</div>${(r.tipoDemanda||r.primeiraCompra||r.local)?`<div class="tags">${r.tipoDemanda?`<span class="tg">${esc(r.tipoDemanda)}</span>`:""}${r.primeiraCompra==="Sim"?`<span class="tg tg-new">1ª compra</span>`:""}${r.local?`<span class="tg">${esc(r.local)}</span>`:""}</div>`:""}
      <div class="tot">${money(r.total||0)}</div>
      <div class="ka"><button class="mini load" onclick="loadRec('${r.id}')">Abrir</button>${r.contato?`<button class="mini" onclick="waQuick('${r.id}')">WhatsApp</button>`:""}<button class="mini del" onclick="delRec('${r.id}')">Excluir</button></div>
    </div>`).join("");
    return `<div class="kcol" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${st}');this.classList.remove('dragover')"><h4>${st} <span class="sum">${cards.length+(st==="Lead"?LEADS.length:0)} \u00b7 ${money(sum)}</span></h4>${html||'<div class="hint" style="padding:6px">vazio</div>'}</div>`;
  }).join("");
}
function drag(ev,id){ev.dataTransfer.setData("text/plain",id);}
function drop(ev,st){ev.preventDefault();const id=ev.dataTransfer.getData("text/plain");if(id)setStage(id,st);}
function waQuick(id){const r=all().find(x=>x.id===id);if(!r||!r.contato)return;const d=r.contato.replace(/\D/g,"");window.open("https://wa.me/55"+d.replace(/^55/,""),"_blank");}
function backup(){const blob=new Blob([JSON.stringify({propostas:all(),precos:JSON.parse(localStorage.getItem("map_precos")||"{}")},null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="map_crm_backup.json";a.click();}
function restore(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);const arr=Array.isArray(j)?j:j.propostas;if(Array.isArray(arr)){persist(arr);if(j.precos)localStorage.setItem("map_precos",JSON.stringify(j.precos));loadPrecos();buildForm();renderKanban();toast("Backup importado");}}catch(e){alert("Arquivo inválido");}};rd.readAsText(f);}

/* init */
loadPrecos(); S=blank(); buildForm(); render();
checkSessionThen();
async function checkSessionThen(){const ok=await checarSessao(); if(ok&&cloudOn())sincronizar(true);}
</script>
